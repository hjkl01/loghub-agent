services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: loghub
      POSTGRES_USER: loghub
      POSTGRES_PASSWORD: loghub
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    ports:
      - "5432:5432"

  server:
    build:
      context: .
      dockerfile: deploy/Dockerfile.server
    environment:
      DATABASE_URL: postgres://loghub:loghub@postgres:5432/loghub
      LISTEN_ADDR: 0.0.0.0:8080
      RUST_LOG: info
    depends_on:
      - postgres
    ports:
      - "8080:8080"

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    depends_on:
      - server
    ports:
      - "3000:80"
    restart: unless-stopped

  agent:
    build:
      context: .
      dockerfile: deploy/Dockerfile.agent
    profiles: ["agent"]
    environment:
      LOGHUB_SERVER_URL: http://server:8080
      LOGHUB_HOSTNAME: ${LOGHUB_HOSTNAME:-docker-host}
      RUST_LOG: ${RUST_LOG:-info}
      SYSTEMD_UNITS: ${SYSTEMD_UNITS:-docker.service}
    depends_on:
      - server
    user: "0:0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /run/log/journal:/run/log/journal:ro
      - /var/log/journal:/var/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
    restart: unless-stopped

volumes:
  postgres-data:
